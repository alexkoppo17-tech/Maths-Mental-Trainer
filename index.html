<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Mental Maths Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

<section id="home" class="screen">

<h1>Mental Maths Trainer</h1>

<p class="subtitle">
Train your speed and accuracy.
</p>

<button class="menu-btn" id="speedBtn">
10 Question Speed Test
</button>

<button class="menu-btn secondary" id="practiceBtn">
Practice Mode
</button>

<p class="small">
Mixed subtraction, multiplication and addition from your original question list.
</p>

</section>


<section id="game" class="screen hidden">

<div class="topbar">

<button class="back-btn" id="backBtn">
←
</button>

<div id="progress">
Question 1 / 10
</div>

<div id="timer">
0.00s
</div>

</div>


<div class="scoreline">

<span id="score">
Correct: 0
</span>

<span id="accuracy">
Accuracy: 0%
</span>

</div>


<div class="question-card">

<div id="question">
18 − 9
</div>

<div id="answerDisplay">
&nbsp;
</div>

</div>


<div class="keypad">

<button class="key" data-key="1">1</button>
<button class="key" data-key="2">2</button>
<button class="key" data-key="3">3</button>

<button class="key" data-key="4">4</button>
<button class="key" data-key="5">5</button>
<button class="key" data-key="6">6</button>

<button class="key" data-key="7">7</button>
<button class="key" data-key="8">8</button>
<button class="key" data-key="9">9</button>

<button class="key action" data-key="clear">
⌫
</button>

<button class="key" data-key="0">
0
</button>

<button class="key action" data-key="clearAll">
C
</button>

</div>


<button id="submitBtn" class="submit-btn">
SUBMIT
</button>

<p id="feedback" class="feedback">
&nbsp;
</p>

</section>


<section id="results" class="screen hidden">

<h1 id="resultTitle">
Finished!
</h1>


<div class="result-card">

<div class="result-big" id="resultScore">
0 / 10
</div>

<div class="result-row">
<span>Correct</span>
<strong id="resultCorrect">0</strong>
</div>

<div class="result-row">
<span>Incorrect</span>
<strong id="resultWrong">0</strong>
</div>

<div class="result-row">
<span>Total time</span>
<strong id="resultTime">0.00 s</strong>
</div>

<div class="result-row">
<span>Average</span>
<strong id="resultAverage">0.00 s</strong>
</div>

</div>


<button class="menu-btn" id="againBtn">
Try Again
</button>

<button class="menu-btn secondary" id="homeBtn">
Home
</button>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
